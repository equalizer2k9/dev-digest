# Ephemeral LiteLLM translating proxy for the eval tool tiers. See litellm.config.yaml for why.
#
#   pnpm --dir evals proxy:up      # generates LITELLM_MASTER_KEY, reads OPENROUTER_API_KEY
#   pnpm --dir evals proxy:down    # stop
#
# Exposes http://localhost:${LITELLM_PORT:-4000} speaking BOTH Anthropic (/v1/messages) and OpenAI
# (/chat/completions) formats. Point OPENROUTER_BASE_URL at it to route every eval tier there.
# Clients authenticate with LITELLM_MASTER_KEY; only this container holds OPENROUTER_API_KEY.

services:
  litellm:
    # Pinned by digest: the floating main-stable tag changed boot behaviour under CI (1.105 refuses
    # to start without a master key). Bump deliberately, together with this digest.
    image: ghcr.io/berriai/litellm:v1.105.1@sha256:b7b9e2c306343721802253d0dd9436b9634a2eb4e14da7c7cf06c5c7b7530802
    container_name: devdigest-eval-litellm
    ports:
      # Loopback only: the proxy runs without a master_key and spends OPENROUTER_API_KEY, so a
      # 0.0.0.0 bind would hand the key to anyone on the LAN (Docker port rules bypass ufw).
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in the environment}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY (scripts/litellm-proxy.sh up generates one)}
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    healthcheck:
      # The image ships Python but not necessarily curl; hit the liveliness endpoint via urllib.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 5s
      timeout: 5s
      retries: 20
